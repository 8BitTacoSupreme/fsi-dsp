---
# =============================================================================
# cp_connect role -- Check mode (GET-only, no mutations)
# =============================================================================
# Reports what would change by comparing existing connector configs with
# desired configs. Uses only GET requests -- never PUT, POST, or DELETE.
# =============================================================================

- name: Resolve Connect REST options
  ansible.builtin.import_tasks: auth.yml

# List currently deployed connectors
- name: List existing connectors
  ansible.builtin.uri:
    url: "{{ cp_connect_url }}/connectors"
    method: GET
    headers: "{{ _cp_connect_auth_headers }}"
    url_username: "{{ cp_connect_user if (_cp_connect_use_basic | bool) else omit }}"
    url_password: "{{ cp_connect_password if (_cp_connect_use_basic | bool) else omit }}"
    force_basic_auth: "{{ _cp_connect_use_basic | bool }}"
    ca_path: "{{ cp_connect_ca_path if (cp_connect_ca_path | length > 0) else omit }}"
    client_cert: "{{ cp_connect_client_cert if (cp_connect_client_cert | length > 0) else omit }}"
    client_key: "{{ cp_connect_client_key if (cp_connect_client_key | length > 0) else omit }}"
    validate_certs: "{{ cp_connect_validate_certs | bool }}"
    return_content: true
    status_code:
      - 200
  register: _existing_connectors
  check_mode: false
  changed_when: false
  no_log: "{{ cp_connect_token | length > 0 }}"

# Retrieve current config for each desired connector
- name: "Get current config for connector {{ connector_item.name }}"
  ansible.builtin.uri:
    url: "{{ cp_connect_url }}/connectors/{{ connector_item.name }}/config"
    method: GET
    headers: "{{ _cp_connect_auth_headers }}"
    url_username: "{{ cp_connect_user if (_cp_connect_use_basic | bool) else omit }}"
    url_password: "{{ cp_connect_password if (_cp_connect_use_basic | bool) else omit }}"
    force_basic_auth: "{{ _cp_connect_use_basic | bool }}"
    ca_path: "{{ cp_connect_ca_path if (cp_connect_ca_path | length > 0) else omit }}"
    client_cert: "{{ cp_connect_client_cert if (cp_connect_client_cert | length > 0) else omit }}"
    client_key: "{{ cp_connect_client_key if (cp_connect_client_key | length > 0) else omit }}"
    validate_certs: "{{ cp_connect_validate_certs | bool }}"
    return_content: true
    status_code:
      - 200
      - 404
  register: _current_configs
  loop: "{{ cp_connectors }}"
  loop_control:
    loop_var: connector_item
    label: "{{ connector_item.name }}"
  check_mode: false
  changed_when: false
  no_log: "{{ cp_connect_token | length > 0 }}"

# Report planned changes
- name: "Report planned changes for connector {{ item.connector_item.name }}"
  ansible.builtin.debug:
    msg: >-
      Connector '{{ item.connector_item.name }}':
      {% if item.status == 404 %}
      Would CREATE (new connector)
      {% elif item.json != item.connector_item.config %}
      Would UPDATE (config differs)
      {% else %}
      No changes (config identical)
      {% endif %}
  loop: "{{ _current_configs.results | default([]) }}"
  loop_control:
    label: "{{ item.connector_item.name }}"
  changed_when: false
