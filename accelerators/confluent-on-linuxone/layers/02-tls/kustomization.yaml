apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# =============================================================================
# 02-tls — mTLS hardening layer
# =============================================================================
# Replaces autoGeneratedCerts with named secretRefs (PEM cert+key+CA) and
# enables mTLS on internal listeners. Does not set CP FIPS mode: it is not yet
# supported on s390x (KNOWN-GAPS.md G-02).
#
# Depends on layer 01-rbac having established MDS (MDS endpoint needs TLS).
# Applied before 03-schema-governance and 04-audit (TLS secrets referenced by
# SR governance bootstrap Job and audit Connect CR).
# =============================================================================

resources:
  # cert-manager Issuer + Certificate CRs for declarative auto-rotation
  - certificate-crs.yaml
  # OpenShift Route for the external listener (edge TLS termination)
  - route-tls.yaml

patches:
  # Kafka: replace autoGeneratedCerts with secretRef + enable mTLS
  - path: patches/kafka-tls.yaml
    target:
      kind: Kafka
      name: kafka
  # SchemaRegistry: PEM secretRef + mTLS to broker
  - path: patches/schemaregistry-tls.yaml
    target:
      kind: SchemaRegistry
      name: schemaregistry
  # ControlCenter: PEM secretRef + mTLS to broker
  - path: patches/controlcenter-tls.yaml
    target:
      kind: ControlCenter
      name: controlcenter
  # Connect: PEM secretRef + mTLS to broker
  - path: patches/connect-tls.yaml
    target:
      kind: Connect
      name: connect
