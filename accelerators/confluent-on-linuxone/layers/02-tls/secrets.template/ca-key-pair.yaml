apiVersion: v1
kind: Secret
metadata:
  name: ca-key-pair
  namespace: confluent
type: kubernetes.io/tls
stringData:
  # Root CA cert and key — generated by ansible/roles/cp_mtls on the target host
  # (keys never traverse the network per ADR-013 decision 2).
  # Replace <PLACEHOLDER> with actual PEM content before applying.
  tls.crt: |
    <PLACEHOLDER_CA_CERT_PEM>
  tls.key: |
    <PLACEHOLDER_CA_KEY_PEM>
